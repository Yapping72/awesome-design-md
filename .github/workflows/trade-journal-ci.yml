name: trade-journal CI

on:
  push:
    branches: [main]
    paths:
      - "trade-journal/**"
      - ".github/workflows/trade-journal-ci.yml"
  pull_request:
    paths:
      - "trade-journal/**"
      - ".github/workflows/trade-journal-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-journal/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: trade_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d trade_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trade-journal/backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the app against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://journal:journal@localhost:5432/trade_journal
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health
          curl -sf -X POST http://localhost:8000/api/upload -F "file=@tests/sample_data/sample_ibkr_activity.csv"
          curl -sf http://localhost:8000/api/pnl/summary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-journal/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: trade-journal/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck and build
        run: npm run build
