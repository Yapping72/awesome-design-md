server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend container, so the frontend never
    # needs to know the backend's URL at build time — it just calls /api/*
    # against whatever host/port it's itself being served from. This is
    # what makes the built image portable across environments without a
    # rebuild (see VITE_API_URL in the frontend Dockerfile/README).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
